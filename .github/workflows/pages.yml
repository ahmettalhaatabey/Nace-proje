name: Siteyi yayınla (GitHub Pages)

on:
  push:
    branches: ["claude/nace-code-risk-app-22agt3", "main"]
    paths-ignore: ["README.md"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Site dosyalarını hazırla
        run: |
          mkdir -p _site
          cp -r index.html assets vendor data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
