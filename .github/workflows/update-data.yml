name: Tehlike sınıfları listesini güncelle

# Resmî Ek-1 listesini her gün mevzuat.gov.tr'den kontrol eder.
# Liste değiştiyse veri dosyalarını günceller, değişiklik kaydını tutar ve siteyi yeniden yayınlar.
on:
  schedule:
    - cron: "17 3 * * *"   # her gün 06:17 (TSİ)
  workflow_dispatch:
  push:
    paths: ["scripts/update_data.py", ".github/workflows/update-data.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.update.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests openpyxl
      - name: Resmî listeyi indir ve ayrıştır
        id: update
        run: python scripts/update_data.py
      - name: Değişiklik varsa kaydet
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Veri: tehlike sınıfları listesi güncellendi ($(date -u +%Y-%m-%d))"
          git push

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
